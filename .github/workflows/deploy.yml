name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [deploy]
  workflow_dispatch:      # lets you trigger manually from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deployment dependencies
        run: pip install huggingface_hub

      # ── Push code files only — model already lives in the Space ──────────────
      # To update the model: upload unet_int8.onnx + config.yaml to the Space
      # repo directly via HF Hub UI or hf_hub_upload, then trigger this workflow.
      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = "Bhavik/CIFAR_DDPM"

          uploads = [
              "app.py",
              "requirements-deploy.txt",
              "Dockerfile",
              ".dockerignore",
          ]

          for path in uploads:
              api.upload_file(
                  path_or_fileobj=path,
                  path_in_repo=path,
                  repo_id=space_id,
                  repo_type="space",
              )
              print(f"  ✓ {path}")

          print("Space updated — HuggingFace will rebuild the Docker image automatically.")
          EOF
