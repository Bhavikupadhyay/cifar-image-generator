name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [deploy]
  workflow_dispatch:      # lets you trigger manually from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deployment dependencies
        run: pip install huggingface_hub onnxruntime

      # ── Pull the latest model from HF Hub model registry ──────────────────
      - name: Download model from HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, shutil
          from huggingface_hub import hf_hub_download

          os.makedirs("model", exist_ok=True)
          for filename in ["unet_int8.onnx", "config.yaml"]:
              cached = hf_hub_download(
                  repo_id="Bhavik/cifar-ddpm",
                  filename=filename,
                  token=os.environ["HF_TOKEN"],
              )
              shutil.copy(cached, f"model/{filename}")
              print(f"Downloaded {filename}")
          EOF

      # ── Smoke-test: verify the ONNX model produces valid output ───────────
      - name: Smoke test
        run: |
          python - <<'EOF'
          import numpy as np
          import onnxruntime as ort

          sess = ort.InferenceSession("model/unet_int8.onnx", providers=["CPUExecutionProvider"])
          x = np.random.randn(1, 3, 32, 32).astype(np.float32)
          t = np.zeros(1, dtype=np.int64)
          out = sess.run(["noise"], {"x": x, "t": t})[0]
          assert out.shape == (1, 3, 32, 32), f"Unexpected output shape: {out.shape}"
          print(f"Smoke test passed — output shape: {out.shape}")
          EOF

      # ── Push app + model to HF Space repo (triggers HF Docker rebuild) ────
      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = "Bhavik/CIFAR_DDPM"

          uploads = [
              "app.py",
              "requirements-deploy.txt",
              "Dockerfile",
              ".dockerignore",
              "model/unet_int8.onnx",
              "model/config.yaml",
          ]

          for path in uploads:
              api.upload_file(
                  path_or_fileobj=path,
                  path_in_repo=path,
                  repo_id=space_id,
                  repo_type="space",
              )
              print(f"  ✓ {path}")

          print("Space updated — HuggingFace will rebuild the Docker image automatically.")
          EOF
